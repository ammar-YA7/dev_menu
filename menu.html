    renderCoffeeModal(p.coffee);

    const L = currentLang === 'ar' ? 0 : 1;
    const meta = [];
    if (caloriesOn() && p.calories != null && !img && !vid) {
      meta.push(`<span class="inline-flex items-center gap-1 bg-amber-400/15 text-amber-200 border border-amber-400/30 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-fire-flame-simple"></i> ${Number(p.calories)} ${L ? 'kcal' : 'سعرة حرارية'}</span>`);
    }
    String(p.allergens || '').split(',').filter(k => ALLERGEN_LABELS[k]).forEach(k => {
      meta.push(`<span class="inline-flex items-center gap-1 bg-white/10 text-gray-200 border border-white/15 text-[10px] font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-triangle-exclamation text-[9px] text-amber-300"></i> ${ALLERGEN_LABELS[k][L]}</span>`);
    });
    document.getElementById('modalMeta').innerHTML = meta.join('');

    const box = document.getElementById('modalOrderBox');
    const canOrder = orderingOn() && p.is_available !== false;
    box.classList.toggle('hidden', !canOrder);
    box.classList.toggle('flex', canOrder);
    modalQty = 1;
    renderModalSizes(p);
    renderModalExtras(p);
    updateModalAdd(p);

    currentModalProduct = p.id;
    trackOnce(`d:${p.id}`, 'dish', p.id);
    document.getElementById('productModal').classList.remove('opacity-0', 'pointer-events-none');
  }

  let currentModalProduct = null, modalQty = 1, modalSize = null, modalExtras = [];
  function renderModalExtras(p) {
    const box = document.getElementById('modalExtras');
    const gs = extrasOf(p), on = orderingOn() && p.is_available !== false;
    box.classList.toggle('hidden', !gs.length);
    box.innerHTML = gs.map((g, gi) => {
      const picked = modalExtras.filter(x => x.g === g.name).length;
      const rule = g.required ? T('إجباري · اختر واحد', 'Required · pick one') : T('اختياري', 'Optional');
      return `<div data-exg="${gi}" class="ex-group">
        <div class="flex items-center justify-between gap-2 mb-1.5"><b class="text-sm font-black text-white">${esc((currentLang !== 'ar' && g.name_en) || g.name)}</b><span class="ex-rule ${g.required && !picked ? 'need' : ''} text-[10.5px] font-bold px-2 py-0.5 rounded-full">${rule}</span></div>
        <div class="grid gap-1.5">${g.options.map((o, oi) => {
          const sel = modalExtras.some(x => x.g === g.name && x.o === o.name);
          const price = Number(o.price) || 0;
          return `<button type="button" ${on ? '' : 'disabled'} data-exo="${gi}:${oi}" class="ex-opt ${sel ? 'on' : ''} flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl text-[13px] font-bold">
            <span class="flex items-center gap-2"><span class="ex-box ${g.required ? 'radio' : ''}"></span>${esc((currentLang !== 'ar' && o.name_en) || o.name)}</span>
            <span class="opacity-80">${price ? `+${esc(money(price))}` : T('مجاناً', 'Free')}</span></button>`;
        }).join('')}</div></div>`;
    }).join('');
  }
  document.getElementById('modalExtras').addEventListener('click', (e) => {
    const b = e.target.closest('[data-exo]'); if (!b) return;
    const p = productById(currentModalProduct); if (!p) return;
    const [gi, oi] = b.dataset.exo.split(':').map(Number);
    const g = extrasOf(p)[gi], o = g && g.options[oi]; if (!o) return;
    const has = modalExtras.some(x => x.g === g.name && x.o === o.name);
    if (has) modalExtras = modalExtras.filter(x => !(x.g === g.name && x.o === o.name));
    // الإجبارية اختيار واحد (يتبدل)، والاختيارية يختار منها اللي يبي
    else if (g.required) modalExtras = [...modalExtras.filter(x => x.g !== g.name), { g: g.name, o: o.name }];
    else modalExtras.push({ g: g.name, o: o.name });
    renderModalExtras(p); updateModalAdd(p);
  });

  function renderModalSizes(p) {
    const box = document.getElementById('modalSizes');
    const zs = sizesOf(p);
    box.classList.toggle('hidden', !zs.length);
    box.classList.toggle('flex', zs.length > 0);
    box.innerHTML = zs.map((z, i) => `
      <button type="button" data-size="${i}" class="size-chip ${z.name === modalSize ? 'on' : ''} px-3.5 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5">
        <span>${esc(sizeName(z))}</span><span class="opacity-75">${esc(money(discounted(p, Number(z.price))))}</span>
      </button>`).join('');
  }
  document.getElementById('modalSizes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-size]'); if (!b) return;
    const p = productById(currentModalProduct); if (!p) return;
    const z = sizesOf(p)[Number(b.dataset.size)]; if (!z) return;
    modalSize = z.name;
    renderModalSizes(p);
    updateModalAdd(p);
  });

  // ─── سلة الطلب عبر واتساب ───
  const T = (ar, en) => currentLang === 'ar' ? ar : en;
  let cart = [];   // [{ id, size, qty }] — size = اسم الحجم أو null
  let coupon = null; // نتيجة فحص الكوبون من الخادم: { coupon, subtotal, discount, total }
  const cartKey = () => `cart:${project.id}`;
  const waNumber = () => String((project && project.whatsapp_number) || '').replace(/\D/g, '');
  // الطلب للكاشير من المنيو (صاحب المحل مشغّله): 'table' طاولات، 'self' خدمة ذاتية مع رقم بيجر. وإلا واتساب
  const directMode = () => (project && project.order_mode) ? 'table' : null;
  const orderingOn = () => {
    if (directMode()) return true;
    const wa = waNumber();
    const valid = wa.startsWith('966') ? /^9665\d{8}$/.test(wa) : /^[1-9]\d{10,14}$/.test(wa);
    return !!(project && project.whatsapp_orders && valid);
  };
  const cartQty = (id) => cart.filter(c => String(c.id) === String(id)).reduce((n, c) => n + c.qty, 0);
  const sameLine = (c, id, size, note, extras) => String(c.id) === String(id) && (c.size || null) === (size || null) && (c.note || null) === (note || null) && exKey(c.extras) === exKey(extras);
  const lineName = (p, c) => productName(p) + (c.size ? ` (${sizeName(sizesOf(p).find(z => z.name === c.size) || { name: c.size })})` : '');
  const productById = (id) => allProducts.find(x => String(x.id) === String(id));
  const round2 = (n) => Math.round(n * 100) / 100;

  function loadCart() {
    try { cart = JSON.parse(sessionStorage.getItem(cartKey()) || '[]'); } catch { cart = []; }
    // نشيل أي صنف انحذف أو صار غير متوفر
    cart = cart.filter(c => {
      const p = productById(c.id);
      if (!p || p.is_available === false || !(c.qty > 0)) return false;
      // الحجم لازم يكون موجود للطبق اللي له أحجام، وفاضي للطبق اللي ما له
      if (!(sizesOf(p).length ? unitPrice(p, c.size) !== null : !c.size)) return false;
      // الإضافات: نشيل اللي انحذف، وإذا الإجباري ناقص ينشال السطر (يرجع يختاره)
      c.extras = (Array.isArray(c.extras) ? c.extras : []).filter(x => exOpt(p, x));
      return extrasOf(p).every(g => !g.required || c.extras.some(x => x.g === g.name));
    }).map(c => ({ id: c.id, size: c.size || null, qty: c.qty, note: c.note || null, extras: c.extras.length ? c.extras : undefined }));
  }
  function saveCart() {
    try { sessionStorage.setItem(cartKey(), JSON.stringify(cart)); } catch {}
    renderCartBar();
    handleSearch();   // تحديث أرقام الكمية على البطاقات
    // أي تغيير في السلة يعيد حساب الكوبون من الخادم
    if (coupon) { clearTimeout(saveCart.t); saveCart.t = setTimeout(() => cart.length ? applyCoupon(true) : resetCoupon(), 350); }
  }
  function cartTotals() {
    let count = 0, total = 0;
    cart.forEach(c => { const p = productById(c.id); const u = p && linePrice(p, c); if (u != null) { count += c.qty; total += u * c.qty; } });
    return { count, total: round2(total) };
  }

  function menuToast(msg, ms = 1600) {
    const t = document.getElementById('menuToast');
    document.getElementById('menuToastText').textContent = msg;
    t.classList.remove('opacity-0', '-translate-y-3');
    clearTimeout(menuToast.t);
    menuToast.t = setTimeout(() => t.classList.add('opacity-0', '-translate-y-3'), ms);
  }

  function addToCart(id, qty, size = null, note = null, extras = []) {
    note = directMode() ? (String(note || '').trim().slice(0, 100) || null) : null;
    const p = productById(id);
    if (!p || p.is_available === false || !orderingOn()) return;
    if (sizesOf(p).length && unitPrice(p, size) === null) return openModal(id);
    extras = (extras || []).filter(x => exOpt(p, x));
    if (extrasOf(p).some(g => g.required && !extras.some(x => x.g === g.name))) return openModal(id);
    if (!sizesOf(p).length) size = null;
    const item = cart.find(c => sameLine(c, p.id, size, note, extras));
    if (item) item.qty = Math.min(directMode() ? 20 : 99, item.qty + qty);
    else cart.push({ id: p.id, size, qty: Math.min(directMode() ? 20 : 99, qty), note, ...(extras.length ? { extras: extras.map(x => ({ g: x.g, o: x.o })) } : {}) });
    saveCart();
    flyToCart();
    const n = lineName(p, { size });
    menuToast(T(`أُضيف للطلب: ${n}`, `Added: ${n}`));
  }

  // ─── حركة الإضافة: صورة الطبق تطير لشريط الطلب، والجوال يهتز خفيف (أندرويد) ───
  let addFrom = null;
  function markAddFrom(media, fallback) {
    const el = media && media.getBoundingClientRect().width ? media : fallback;
    if (!el) return (addFrom = null);
    const r = el.getBoundingClientRect();
    const pic = media ? (media.tagName === 'VIDEO' ? media.poster : media.currentSrc || media.src) : '';
    addFrom = { r, pic, at: Date.now() };
  }
  function bumpCart() {
    const bar = document.getElementById('cartBar');
    if (!bar || bar.classList.contains('hidden') || !bar.animate || calmMotion) return;
    bar.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' });
  }
  function flyToCart() {
    try { navigator.vibrate && navigator.vibrate(12); } catch {}
    const from = addFrom; addFrom = null;
    const dot = document.getElementById('cartCount'), bar = document.getElementById('cartBar');
    if (!from || Date.now() - from.at > 1500 || calmMotion || !dot || bar.classList.contains('hidden') || !document.body.animate) return bumpCart();
    const t = dot.getBoundingClientRect();
    const size = Math.min(110, Math.max(44, Math.min(from.r.width, from.r.height)));
    const x0 = from.r.left + from.r.width / 2 - size / 2, y0 = from.r.top + from.r.height / 2 - size / 2;
    const dx = t.left + t.width / 2 - (x0 + size / 2), dy = t.top + t.height / 2 - (y0 + size / 2);
    const g = document.createElement('div');
    g.className = 'fly-ghost';
    g.style.cssText = `left:${x0}px;top:${y0}px;width:${size}px;height:${size}px;${from.pic ? `background-image:url("${String(from.pic).replace(/"/g, '%22')}")` : ''}`;
    document.body.appendChild(g);
    const lift = Math.min(120, Math.abs(dy) * 0.35 + 40);
    g.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1, borderRadius: '16px' },
      { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - lift}px) scale(.7)`, opacity: 1, offset: 0.45 },
      { transform: `translate(${dx}px, ${dy}px) scale(.18)`, opacity: .4, borderRadius: '50%' }
    ], { duration: 640, easing: 'cubic-bezier(.45,.05,.55,.95)' }).onfinish = () => { g.remove(); bumpCart(); };
  }
  function setQty(i, qty) {
    if (!cart[i]) return;
    if (qty <= 0) cart.splice(i, 1); else cart[i].qty = Math.min(directMode() ? 20 : 99, qty);
    saveCart();
    renderCartItems();
    if (!cart.length) closeCart();
  }

  function renderCartBar() {
    const bar = document.getElementById('cartBar');
    const { count, total } = cartTotals();
    const show = orderingOn() && count > 0;
    bar.classList.toggle('hidden', !show);
    bar.classList.toggle('flex', show);
    document.body.style.paddingBottom = show ? '96px' : '';
    document.body.classList.toggle('ix-cart', show);   // أزرار المنيو التفاعلي تطلع فوق شريط الطلب
    if (!show) return;
    document.getElementById('cartCount').textContent = count;
    document.getElementById('cartBarText').textContent = T('عرض الطلب', 'View order');
    document.getElementById('cartBarTotal').textContent = money(coupon ? coupon.total : total);
  }

  function renderCartItems() {
    document.getElementById('cartItems').innerHTML = cart.map((c, i) => {
      const p = productById(c.id); if (!p) return '';
      const u = linePrice(p, c) || 0;
      return `
        <li class="bg-white/5 border border-white/10 rounded-2xl p-2.5">
          <div class="flex items-center gap-3">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold text-white leading-snug line-clamp-2">${esc(lineName(p, c))}</p>
              ${c.extras && c.extras.length ? `<p class="text-[11.5px] font-bold text-gray-300 mt-0.5">+ ${esc(exText(p, c.extras))}</p>` : ''}
              <p class="text-[11px] text-gray-400 mt-0.5">${esc(money(round2(u * c.qty)))}</p>
            </div>
            <div class="flex items-center bg-white/10 border border-white/15 rounded-xl shrink-0" dir="ltr">
              <button type="button" onclick="setQty(${i}, ${c.qty - 1})" aria-label="-" class="w-9 h-9 text-white font-black">${c.qty === 1 ? '<i class="fa-solid fa-trash text-[11px] text-red-300"></i>' : '−'}</button>
              <span class="w-6 text-center text-sm font-black text-white">${c.qty}</span>
              <button type="button" onclick="setQty(${i}, ${c.qty + 1})" aria-label="+" class="w-9 h-9 text-white font-black">+</button>
            </div>
          </div>
          ${directMode() ? `<input data-note="${i}" value="${esc(c.note || '')}" maxlength="100" autocomplete="off" placeholder="${esc(T('ملاحظة على هذا الصنف (اختياري)', 'Note for this item (optional)'))}" class="mt-2 w-full bg-white/5 border border-white/15 rounded-lg px-2.5 py-2 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-white/40" style="font-size:16px">` : ''}
        </li>`;
    }).join('');
    renderCouponTotals();
  }

  // ملاحظة الصنف تنحفظ وهو يكتب (بدون إعادة رسم السلة عشان ما يطلع الكيبورد)
  document.getElementById('cartItems').addEventListener('input', (e) => {
    const el = e.target.closest('[data-note]'); if (!el || !cart[+el.dataset.note]) return;
    cart[+el.dataset.note].note = el.value.slice(0, 100) || null;
    try { sessionStorage.setItem(cartKey(), JSON.stringify(cart)); } catch {}
  });
  // ─── كوبون الخصم (الخادم يتحقق منه ويحسب الخصم بأسعار قاعدة البيانات) ───
  function renderCouponTotals() {
    const row = document.getElementById('discountRow');
    row.classList.toggle('hidden', !coupon); row.classList.toggle('flex', !!coupon);
    if (coupon) {
      document.getElementById('discountLabel').textContent = `${T('الخصم', 'Discount')} (${coupon.coupon.code})`;
      document.getElementById('discountValue').textContent = `− ${money(coupon.discount)}`;
    }
    document.getElementById('cartTotal').textContent = money((coupon ? coupon.total : cartTotals().total) + deliveryFee());
    document.getElementById('couponBtn').textContent = coupon ? T('إزالة', 'Remove') : T('تطبيق', 'Apply');
  }
  function couponMsg(text, ok) {
    const m = document.getElementById('couponMsg');
    m.textContent = text || '';
    m.classList.toggle('hidden', !text);
    m.className = `${text ? '' : 'hidden '}text-[11px] font-bold ${ok ? 'text-green-300' : 'text-red-300'}`;
  }
  function resetCoupon() {
    coupon = null;
    document.getElementById('couponInput').value = '';
    couponMsg('');
    renderCouponTotals();
    renderCartBar();
  }
  async function applyCoupon(silent = false) {
    if (!silent && coupon) return resetCoupon();   // الزر يصير "إزالة" بعد التطبيق
    const code = document.getElementById('couponInput').value.trim().toUpperCase();
    if (!code) return couponMsg(T('اكتب رمز الكوبون', 'Enter a coupon code'), false);
    const btn = document.getElementById('couponBtn');
    btn.disabled = true;
    try {
      coupon = await DM.post('/api/public?action=coupon', {
        slug: project.client_slug, code, items: cart.map(c => ({ id: c.id, size: c.size, qty: c.qty, extras: c.extras }))
      });
      couponMsg(T(`تم تطبيق الكوبون، وفّرت ${money(coupon.discount)}`, `Coupon applied — you save ${money(coupon.discount)}`), true);
    } catch (e) {
      coupon = null;
      couponMsg(e.status === 0 ? T('تعذر الاتصال، حاول مرة ثانية', 'Connection failed, try again') : (currentLang === 'ar' ? e.message : 'This coupon cannot be applied'), false);
    } finally {
      btn.disabled = false;
      renderCouponTotals();
      renderCartBar();
    }
  }
  document.getElementById('couponInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!coupon) applyCoupon(); } });

  function openCart() {
    if (!cart.length) return;
    const dm = directMode();
    document.getElementById('cartTitle').innerHTML = `<i class="${dm ? 'fa-solid fa-list' : 'fa-brands fa-whatsapp text-[#25d366]'}"></i> ${T('طلبك', 'Your order')}`;
    document.getElementById('cartNoteLabel').textContent = T('ملاحظات على الطلب (اختياري)', 'Order notes (optional)');
    document.getElementById('cartNote').placeholder = T('مثال: بدون بصل، سكر خفيف...', 'e.g. no onions, less sugar...');
    document.getElementById('cartTotalLabel').textContent = T('المجموع', 'Total');
    document.getElementById('cartSendText').textContent = dm ? (foodPlace() ? T('أرسل الطلب للكاشير', 'Send order to the cashier') : T('أرسل الطلب', 'Send order')) : T('إرسال الطلب عبر واتساب', 'Send order via WhatsApp');
    document.querySelector('#cartSend i').className = dm ? 'fa-solid fa-arrow-up text-lg' : 'fa-brands fa-whatsapp text-lg';
    renderDirect();
    document.getElementById('cartClear').textContent = T('تفريغ الطلب', 'Clear order');
    document.getElementById('couponBox').classList.toggle('hidden', project.has_coupons !== true);
    document.getElementById('couponLabel').textContent = T('كوبون خصم', 'Discount coupon');
    renderCartItems();
    document.getElementById('cartModal').classList.remove('opacity-0', 'pointer-events-none');
    lockPage(true);
  }
  function closeCart() { document.getElementById('cartModal').classList.add('opacity-0', 'pointer-events-none'); lockPage(false); cartTyping = false; fitCart(); }
  // الصفحة اللي ورا نافذة الطلب تثبت مكانها (سفاري ما يقدر يمرّرها لما يطلع الكيبورد، فما تهتز النافذة)
  let lockedY = null;
  function lockPage(on) {
    const b = document.body;

  // ─── الطلب للكاشير (بدون واتساب) ───
  // العميل يرسل طلبه ويطلع له رمز (A12) يعرّف فيه نفسه للكاشير. رقم الطاولة اختياري: من QR الطاولة (?table=12) أو يكتبه
  let tableEdit = false, dine = 'in', delLoc = null, whenMode = 'asap';
  const orderOpts = () => Object.assign({ dine: true, pickup: true, delivery: false, fee: 0, area: '', schedule: false }, (project && project.order_opts) || {});

  // بطاقات النداء اللي أضافها من صفحة البيجر (الكوكي على devmenu.digital كله، أو التخزين المحلي)

    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^dm_pc_|^dm_pcard_/.test(k)) { const v = localStorage.getItem(k); if (/^[A-Za-z0-9_-]{10,64}$/.test(v || '')) out.add(v); } } } catch {}

  }
  // السفري استلمه الكاشير: صفحة البيجر برقمه (يرن لما يجهز، وفيها بطاقة النداء)

  const qrTable = (() => {

  const devId = () => { try { let d = localStorage.getItem('dm_dev'); if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(18)), b => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'[b & 63]).join(''); localStorage.setItem('dm_dev', d); } return d; } catch { return ''; } };
  const tableKey = () => `dm_table_${project.id}`;
  function renderDirect() {
    const dm = directMode();
    document.getElementById('cartDirect').classList.toggle('hidden', !dm);

  function directErr(msg) { const m = document.getElementById('directMsg'); m.textContent = msg; m.classList.remove('hidden'); }
  async function sendDirect() {
    // معاينة لوحة التحكم: نوري صاحب المحل الخطوات بدون ما يوصل طلب للكاشير

    // التوصيل والموعد
    const extra = {};
    if (dine === 'delivery') {
      const phone = document.getElementById('delPhone').value.trim().replace(/[\u0660-\u0669\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) & 15)).replace(/\D/g, '');

      const at = Date.parse(`${day}T${time}:00+03:00`);
      if (!(at > Date.now() + 10 * 60e3)) { directErr(T('اختر وقت بعد ربع ساعة على الأقل', 'Pick a time at least 15 minutes from now')); return; }

    const btn = document.getElementById('cartSend'); btn.disabled = true;

      const r = await DM.post('/api/public?action=order', { slug: project.client_slug, dev: devId(), lang: currentLang, dine, table: dine === 'in' ? table : '', ...extra, ...cards,
        items: cart.map(c => ({ id: c.id, qty: c.qty, size: c.size, note: c.note, extras: c.extras })), coupon: coupon ? coupon.coupon.code : undefined });

      renderOrders(); openOrders();
    } catch (e) {

      });

  }

  // ─── طلباتي: تتحفظ في الجوال، والحالة تتحدث لحظياً (وصل ← استلمه الكاشير ← تم) ───
  let myOrders = [];
  const ordersKey = () => `dm_mo_${project.id}`;
  function saveOrders() { try { localStorage.setItem(ordersKey(), JSON.stringify(myOrders.map(o => ({ token: o.token, at: o.created_at })))); } catch {} }
  function watchOrder(topic) { if (topic && !watchOrder.on.has(topic)) { watchOrder.on.add(topic); DM.live(topic, () => refreshOrders()); } }
  watchOrder.on = new Set();

  document.addEventListener('visibilitychange', () => { if (!document.hidden && project && directMode()) refreshOrders(); });
  async function refreshOrders() {
    let saved = []; try { saved = JSON.parse(localStorage.getItem(ordersKey()) || '[]'); } catch {}
    saved = saved.filter(o => o && o.token && Date.now() - Date.parse(o.at || 0) < 12 * 3600e3);

    try {
      const r = await DM.get(`/api/public?action=order-status&slug=${encodeURIComponent(project.client_slug)}&t=${saved.map(o => o.token).join(',')}`);
      const before = new Map(myOrders.map(o => [o.token, o.status]));
      const all = r.orders.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
      // تغيّرت الحالة: تنبيه صغير + اهتزاز

      const paged = all.find(o => o.pager_token && o.status === 'accepted' && before.has(o.token));
      if (paged) { myOrders = all.filter(o => o.token !== paged.token && ['new', 'accepted'].includes(o.status)); saveOrders(); return goWaiting(paged); }
      const changed = all.find(o => before.has(o.token) && before.get(o.token) !== o.status);
      if (changed) { menuToast(ST[changed.status][currentLang === 'ar' ? 0 : 1], ['served', 'cancelled'].includes(changed.status) ? 4000 : 1600); try { navigator.vibrate && navigator.vibrate(200); } catch {} }

      myOrders = all.filter(o => ['new', 'accepted'].includes(o.status));

    if (myOrders.some(o => ['new', 'accepted'].includes(o.status))) refreshOrders.t = setTimeout(refreshOrders, 8000);
  }
  // المطاعم والمقاهي «الكاشير»، والمتاجر والأسر المنتجة ومحلات الورود «المتجر» (ما فيه كاشير)

      let d = `M ${f(start[0])} ${f(start[1])}`, prev = start;
      [...pts, [w / 2, pts[pts.length - 1][1] + 90]].forEach(([x, y], k) => {
        // نقاط التحكم تميل لجهة النص شوي، مع اهتزاز ثابت لكل مقطع (ما يتغير مع كل رسم)
        const wob = [42, -30, 26, -46, 34][k % 5], dy = y - prev[1];
        d += ` C ${f(prev[0] + wob)} ${f(prev[1] + dy * .45)}, ${f(x - wob * 1.4)} ${f(y - dy * .5)}, ${f(x)} ${f(y)}`;
        prev = [x, y];
      });
      path.setAttribute('d', d);
      if (!draw || calmMotion || !path.getTotalLength) { path.style.strokeDasharray = ''; path.style.strokeDashoffset = ''; return; }
      const len = path.getTotalLength();
      path.style.transition = 'none'; path.style.strokeDasharray = `${len}`; path.style.strokeDashoffset = `${len}`;
      void path.getBoundingClientRect();
      path.style.transition = 'stroke-dashoffset 1.8s cubic-bezier(.45, .05, .3, 1) .25s'; path.style.strokeDashoffset = '0';
    });
  }
  // المقاس يتغير (تدوير الجهاز أو تحميل الخط): نعيد حساب الخيط بدون حركة
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (ixScreen === 'cat' && ixLook().style === 'thread') ixThreads(ixEl('ixCat'), false); }).observe(ixEl('ixCat'));
  window.addEventListener('resize', () => { if (document.body.classList.contains('ix-mode') && ixLook().style === 'thread') ixThreads(ixEl('ixCat'), false); });
  // step = جهة الانتقال لما يبدّل القسم من الشريط أو بالسحب (0 = أول دخول)
  function ixRenderCat(key, step = 0) {
    const cats = ixCatsOf(key), items = ixHomeItems();
    let i = 0;
    const style = ixLook().style;
    // «متعرج»: خط بالنص والأصناف يمين ويسار بالتناوب، و«خيط»: أطباق متفرقة يربطها خيط ذهبي، وإلا الشبكة
    const box = (ps) => style === 'zigzag'
      ? `<div class="ix-zz">${ps.map(p => ixZRow(p, i++)).join('')}</div>`
      : style === 'thread'
      ? `<div class="ix-th"><svg class="ix-thread" aria-hidden="true"><path/></svg>${ps.map(p => ixTRow(p, i++)).join('')}</div>`
      : `<div class="ix-grid">${ps.map(p => ixCard(p, i++)).join('')}</div>`;
    // الفئات الفرعية داخل القسم: الأطباق بدون فئة فرعية أول، وبعدها كل فئة تحت عنوانها
    const grid = (c) => {
      const ps = productsIn(c, allProducts), subs = [...new Set(ps.map(p => p.subgroup).filter(Boolean))];
      if (!subs.length) return box(ps);
      const plain = ps.filter(p => !p.subgroup);
      return (plain.length ? box(plain) : '') + subs.map(g => `<h4 class="ix-sec ix-sub">${esc(tr(g))}</h4>${box(ps.filter(p => p.subgroup === g))}`).join('');
    };
    ixEl('ixCat').innerHTML = `
      <div class="ix-list ${step ? 'ix-slide' : ''}" style="--sx:${ixSx(step)}">
        ${style === 'thread' && project && project.name ? `<p class="ix-tstore ix-pop" style="--i:0">${esc(project.name)}</p>` : ''}
        <h2 class="ix-title ix-pop" style="--i:0">${esc(ixTitle(key, cats))}</h2>
        ${items.length > 1 ? `<div class="ix-chips" role="tablist">${items.map(x => `<button type="button" role="tab" aria-selected="${x.key === key}" class="ix-chip ${x.key === key ? 'on' : ''}" data-ix-chip="${esc(x.key)}">${esc(x.label)}</button>`).join('')}</div>` : ''}
        ${cats.length > 1 ? cats.map(c => `<h3 class="ix-sec">${esc(catName(c))}</h3>${grid(c)}`).join('') : cats.map(grid).join('')}
      </div>`;
    ixWatchPics(ixEl('ixCat'));
    if (style === 'thread') ixThreads(ixEl('ixCat'), true);
    // القسم الحالي في نص الشريط (نحرّك الشريط بس، مو الصفحة)
    const bar = ixEl('ixCat').querySelector('.ix-chips'), on = bar && bar.querySelector('.on');
    if (on) bar.scrollLeft += (on.getBoundingClientRect().left + on.offsetWidth / 2) - (bar.getBoundingClientRect().left + bar.clientWidth / 2);
  }
  // جهة دخول المحتوى الجديد بالبكسل: التالي يدخل من جهة القراءة (من اليسار بالعربي)
  const ixRtl = () => document.documentElement.dir !== 'ltr';
  const ixSx = (step) => step ? (step > 0 ? 1 : -1) * (ixRtl() ? -1 : 1) : 0;
  // fly = الصورة جاية طايرة من البطاقة، فما نحرّكها هنا. step = بدّل للصنف اللي بعده/قبله
  function ixRenderProd(p, { fly = false, step = 0 } = {}) {
    const off = p.is_available === false, canOrder = !off && orderingOn();
    const img = ixImg(p), vid = safeUrl(p.video_url), desc = productDesc(p), zs = sizesOf(p), deal = autoDeal(p);
    const tags = [
      deal ? `<span class="deal">${T(`خصم ${promoLabel(deal)}`, `${promoLabel(deal)} off`)}</span>` : '',
      p.is_bestseller === true ? `<span>${T('مميز', 'Featured')}</span>` : '',
      caloriesOn() && p.calories != null ? `<span>${Number(p.calories)} ${T('سعرة حرارية', 'kcal')}</span>` : ''
    ].join('');
    // مكانه بين أصناف القسم (3 / 8) وأزرار السابق والتالي
    const list = ixList(), at = list.findIndex(x => x.id === p.id);
    const pager = list.length > 1 && at >= 0 ? `
      <div class="ix-pager">
        <button type="button" class="ix-arrow" data-ix-step="-1" ${at === 0 ? 'disabled' : ''} aria-label="${T('السابق', 'Previous')}">${IX_ICON.back}</button>
        <span dir="ltr">${at + 1} / ${list.length}</span>
        <button type="button" class="ix-arrow" data-ix-step="1" ${at === list.length - 1 ? 'disabled' : ''} aria-label="${T('التالي', 'Next')}">${IX_ICON.next}</button>
      </div>` : '';
    // «يناسبه معه»: ثلاثة أصناف ثانية من نفس القسم (اللي بعده بالترتيب، واللي لها صور أول)
    const others = at >= 0 ? [...list.slice(at + 1), ...list.slice(0, at)] : list.filter(x => x.id !== p.id);
    const pair = [...others.filter(x => ixImg(x)), ...others.filter(x => !ixImg(x))].slice(0, 3);
    ixEl('ixProd').innerHTML = `
      <div class="ix-hero ${img || vid ? '' : 'nopic'}">
        ${img || vid ? `<div class="ix-heropic ${step ? 'ix-slide' : ''}" style="--sx:${ixSx(step)}"><div class="${fly ? '' : 'ix-pop'}" style="--i:0"><div class="ix-tilt"><div class="ix-float">${ixPic(p, true)}</div></div></div>${pager}</div>` : ''}
        <div>
          <h2 class="ix-hname ix-pop" style="--i:1">${esc(productName(p))}</h2>
          <p class="ix-hprice ix-pop" style="--i:2">${ixPrice(p)}</p>
          ${canOrder ? `<button type="button" class="ix-btn pri ix-add ix-pop" style="--i:3" data-ix-add="${esc(p.id)}">${IX_ICON.plus} ${T('أضف للطلب', 'Add to order')}</button>` : ''}
          ${zs.length > 1 ? `<div class="ix-sizes ix-pop" style="--i:3">${zs.map(z => `<span>${esc(sizeName(z))}<b>${priceHtml(Number(z.price), discounted(p, Number(z.price)))}</b></span>`).join('')}</div>` : ''}
          ${tags ? `<div class="ix-tags ix-pop" style="--i:3">${tags}</div>` : ''}
          ${desc ? `<p class="ix-hdesc ix-pop" style="--i:4">${esc(desc)}</p>` : ''}
          ${off ? `<p class="ix-hdesc ix-pop" style="--i:4;font-weight:700">${T('غير متوفر حالياً', 'Currently unavailable')}</p>` : ''}
          ${img || vid ? '' : pager}
          ${pair.length ? `
            <div class="ix-pair ix-pop" style="--i:6">
              <b>${T('يناسبه معه', 'Goes well with')}</b>
              <div class="ix-pair-row">${pair.map(x => `
                <button type="button" class="ix-mini" data-ix-swap="${esc(x.id)}">
                  ${ixPic(x, false)}
                  <span class="ix-name">${esc(productName(x))}</span>
                  <span class="ix-price">${ixPrice(x)}</span>
                </button>`).join('')}</div>
            </div>` : ''}
        </div>
      </div>`;
    ixWatchPics(ixEl('ixProd'));
  }
  function ixNav() {
    const n = ixEl('ixNav');
    n.innerHTML = ixScreen === 'home' ? '' :
      `<button type="button" class="ix-btn" data-ix-nav="back">${IX_ICON.back} ${T('رجوع', 'Back')}</button>` +
      `<button type="button" class="ix-btn ${ixScreen === 'cat' ? 'pri' : ''}" data-ix-nav="home">${IX_ICON.home} ${T('الرئيسية', 'Home')}</button>`;
  }

  // ─── الصورة المشتركة: صورة البطاقة تطير وتكبر لمكانها في شاشة الطبق (وترجع لما يرجع) ───
  const ixHeroPic = () => ixEl('ixProd').querySelector('.ix-heropic .ix-pic');
  const ixCardPic = (id) => ixEl('ixCat').querySelector(`[data-ix-prod="${CSS.escape(String(id))}"] .ix-pic`);
  const ixCanFly = (pic) => !calmMotion && !!document.body.animate && !!pic && !pic.classList.contains('txt') && !!pic.querySelector('img, video');
  function ixFly(from, to) {
    if (!ixCanFly(from) || !to) return;
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    if (!a.width || !b.width) return;
    const m = from.querySelector('img, video');
    const src = m.tagName === 'VIDEO' ? m.poster : (m.currentSrc || m.src);
    if (!src) return;
    const g = document.createElement('div');
    g.className = `ix-ghost ${from.classList.contains('cut') || to.classList.contains('cut') ? 'cut' : ''} ${ixLook().style === 'zigzag' ? 'round' : ''}`;
    g.style.cssText = `left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;background-image:url("${String(src).replace(/"/g, '%22')}")`;
    const tm = to.querySelector('img, video');
    if (tm && !g.classList.contains('cut')) g.style.borderRadius = getComputedStyle(tm).borderRadius;
    document.body.appendChild(g);

    const done = () => { from.classList.remove('ix-hide'); to.classList.remove('ix-hide'); g.remove(); };

      { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width})` },
      { transform: 'none' }
    ], { duration: 480, easing: 'cubic-bezier(.2, .8, .2, 1)' });
    anim.onfinish = done; anim.oncancel = done;
  }

  // ─── التنقل: تلاشي مع انزلاق خفيف، وزر الرجوع في الجوال يرجع شاشة ───
  const IX_SCR = { home: 'ixHome', cat: 'ixCat', prod: 'ixProd' };
  // still = بدون انزلاق (لما الصورة طايرة لازم مكانها النهائي ثابت)
  function ixShow(name, back, still = false) {
    const next = ixEl(IX_SCR[name]), cur = document.querySelector('#ix .ix-scr.on');
    // التقدّم يدخل من جهة القراءة (من اليسار بالعربي)، والرجوع من الجهة الثانية
    const dx = still ? 0 : (back ? 1 : -1) * (ixRtl() ? 1 : -1);
    if (cur && cur !== next) {
      cur.style.setProperty('--dx', -dx); cur.classList.remove('on', 'enter');
      cur.querySelectorAll('video').forEach(v => { try { v.pause(); } catch {} });
    }
    next.style.transition = 'none'; next.style.setProperty('--dx', dx); void next.offsetWidth; next.style.transition = '';
    if (!back || name === 'home') { next.classList.remove('enter'); void next.offsetWidth; next.classList.add('enter'); }
    next.classList.add('on');
    if (!calmMotion) next.querySelectorAll('video[src]').forEach(v => v.play().catch(() => {}));
    ixScreen = name;
    ixFsBtn();
    ixNav();
  }
  // from = صورة البطاقة اللي انضغطت (تطير لشاشة الطبق)
  function ixGo(name, arg, from = null) {
    if (name === 'cat') { ixKey = arg; ixRenderCat(arg); ixEl('ixCat').scrollTop = 0; }
    else {
      const p = productById(arg); if (!p) return;
      if (!ixKey || !ixCatsOf(ixKey).some(c => productsIn(c, allProducts).some(q => q.id === p.id))) ixKey = ixKeyOf(p);
      ixProd = p.id; ixRenderProd(p, { fly: ixCanFly(from) }); ixEl('ixProd').scrollTop = 0;
      trackOnce(`d:${p.id}`, 'dish', p.id);
    }
    ixDepth++;
    try { history.pushState({ ix: name, k: ixKey, p: ixProd, d: ixDepth }, ''); } catch {}
    const fly = name === 'prod' && ixCanFly(from);
    ixShow(name, false, fly);
    if (fly) ixFly(from, ixHeroPic());
  }
  // نفس الشاشة بمحتوى ثاني (صنف ثاني أو قسم ثاني): نبدّل حالة السجل بدل ما نضيف، عشان زر الرجوع يبقى منطقي
  function ixReplaceState() {
    try { if (history.state && history.state.ix) history.replaceState({ ...history.state, k: ixKey, p: ixProd }, ''); } catch {}
  }
  function ixSwap(id, step) {
    const p = productById(id); if (!p) return;
    ixProd = p.id; ixRenderProd(p, { step: step || 1 }); ixEl('ixProd').scrollTop = 0;
    ixEl('ixProd').classList.remove('enter'); void ixEl('ixProd').offsetWidth; ixEl('ixProd').classList.add('enter');
    trackOnce(`d:${p.id}`, 'dish', p.id);
    ixReplaceState();
  }

    const list = ixList(), at = list.findIndex(x => x.id === ixProd), n = list[at + step];
    if (at < 0 || !n) return ixNudge(ixEl('ixProd').querySelector('.ix-heropic, .ix-hero'), step);

  }
  function ixSwitchCat(key, step) {
    if (!key || key === ixKey || !ixCatsOf(key).length) return;
    ixKey = key; ixRenderCat(key, step); ixEl('ixCat').scrollTop = 0;
    ixEl('ixCat').classList.remove('enter'); void ixEl('ixCat').offsetWidth; ixEl('ixCat').classList.add('enter');
    ixReplaceState();
  }
  function ixStepCat(step) {
    const items = ixHomeItems(), at = items.findIndex(x => x.key === ixKey), n = items[at + step];
    if (at < 0 || !n) return ixNudge(ixEl('ixCat').querySelector('.ix-list'), step);
    ixSwitchCat(n.key, step);
  }
  // آخر القائمة: هزّة خفيفة بدل ما يصير شي

  }

  }
  window.addEventListener('popstate', (e) => {
    if (!ixMode()) return;
    const s = e.state || {}, d = s.ix ? (s.d || 0) : 0, back = d < ixDepth;

    if (s.ix === 'prod' && productById(s.p)) {
      if (s.k && ixKey !== s.k) { ixKey = s.k; ixRenderCat(s.k); }
      if (ixProd !== s.p || ixScreen !== 'prod') { ixProd = s.p; ixRenderProd(productById(s.p)); }
      ixDepth = d; ixShow('prod', back);
    } else if (s.ix === 'cat' && s.k && ixCatsOf(s.k).length) {
      const fromProd = ixScreen === 'prod', hero = fromProd ? ixHeroPic() : null;
      if (ixKey !== s.k || ixScreen === 'home') { ixKey = s.k; ixRenderCat(s.k); }
      ixDepth = d;
      // الرجوع من الطبق: الصورة ترجع لبطاقتها (ونتأكد إن البطاقة ظاهرة لو تنقّل بين الأصناف)
      const card = fromProd ? ixCardPic(ixProd) : null;
      const fly = !!card && ixCanFly(hero);
      if (fly) {
        const sc = ixEl('ixCat'), r = card.getBoundingClientRect(), sr = sc.getBoundingClientRect();

      }

  });

  // ─── السحب يمين ويسار: في شاشة الطبق يتنقل بين أصناف القسم، وفي شاشة القسم بين الأقسام ───
  let ixSwipedAt = 0;
  function ixSwipe(el, fn) {
    let x0 = null, y0 = 0, t0 = 0, id = null;
    el.addEventListener('pointerdown', (e) => { if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return; x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); id = e.pointerId; });

  }

  ixSwipe(ixEl('ixCat'), (step) => { if (ixScreen === 'cat') ixStepCat(step); });

  // ─── ميلان صورة الطبق مع حركة الإصبع أو الماوس ───
  function ixTilt(e) {
    const t = ixEl('ixProd').querySelector('.ix-tilt');
    if (!t || calmMotion || ixScreen !== 'prod') return;
    if (e.pointerType !== 'mouse' && !e.buttons) return;
    const r = t.getBoundingClientRect();
    const cl = (v) => Math.max(-.5, Math.min(.5, v));
    const x = cl((e.clientX - r.left) / r.width - .5), y = cl((e.clientY - r.top) / r.height - .5);

  }
  const ixUntilt = () => { const t = ixEl('ixProd').querySelector('.ix-tilt'); if (t) t.style.transform = ''; };
  ixEl('ixProd').addEventListener('pointermove', ixTilt);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => ixEl('ixProd').addEventListener(ev, ixUntilt));

  ixEl('ix').addEventListener('click', (e) => {
    if (Date.now() - ixSwipedAt < 350) return;   // نهاية سحبة، مو ضغطة
    const c = e.target.closest('[data-ix-cat]'); if (c) return ixGo('cat', c.dataset.ixCat);
    const ch = e.target.closest('[data-ix-chip]');
    if (ch) { const items = ixHomeItems(); return ixSwitchCat(ch.dataset.ixChip, items.findIndex(x => x.key === ch.dataset.ixChip) > items.findIndex(x => x.key === ixKey) ? 1 : -1); }
    const pr = e.target.closest('[data-ix-prod]'); if (pr) return ixGo('prod', pr.dataset.ixProd, pr.querySelector('.ix-pic'));
    const st = e.target.closest('[data-ix-step]'); if (st) return ixStepProd(Number(st.dataset.ixStep));
    const sw = e.target.closest('[data-ix-swap]');
    if (sw) { const list = ixList(); return ixSwap(sw.dataset.ixSwap, list.findIndex(x => String(x.id) === sw.dataset.ixSwap) < list.findIndex(x => x.id === ixProd) ? -1 : 1); }
    const add = e.target.closest('[data-ix-add]');
    if (add) {
      const p = productById(add.dataset.ixAdd); if (!p) return;
      markAddFrom(ixEl('ixProd').querySelector('.ix-pic img, .ix-pic video'), add);
      if (sizesOf(p).length || extrasOf(p).length) openModal(p.id); else addToCart(p.id, 1);
      return;
    }
    const nav = e.target.closest('[data-ix-nav]');
    // رجوع: شاشة وحدة لورا (من القسم للترحيب، ومن الطبق للقسم)
    if (nav) { if (nav.dataset.ixNav === 'home' || ixDepth <= 1 || !(history.state && history.state.ix)) ixHome(); else history.back(); }
  });

  // ─── شكل المنيو التفاعلي: القالب والألوان والملمس (يختارها صاحب المحل، menu_ix) ───
  // ?ixstyle=zigzag للتجربة بس
  const IX_STYLES = { grid: { bg: null, accent: null, texture: 'none' }, zigzag: { bg: '#1f4d3a', accent: '#e9dfc4', texture: 'grain' }, thread: { bg: '#1e4a3a', accent: '#d9c49a', texture: 'paper' } };
  function ixLook() {
    const o = (project && project.menu_ix && typeof project.menu_ix === 'object') ? project.menu_ix : {};
    const t = urlParams.get('ixstyle');
    const style = IX_STYLES[t] ? t : IX_STYLES[o.style] ? o.style : 'grid';
    // قالب التجربة غير قالب المحل: نعرضه بألوانه وإعداداته الافتراضية
    const own = !IX_STYLES[t] || t === o.style;
    const hex = (c) => own && window.DMTheme && DMTheme.isHex(c) ? c.toLowerCase() : null;
    const d = IX_STYLES[style];
    // الملمس: grain حبيبات، paper ورق، none بدون (القيم القديمة true/false = grain/none)، وفاضي = افتراضي القالب
    const tx = urlParams.get('ixtex') || (own ? o.texture : null);
    const texture = tx === true ? 'grain' : tx === false ? 'none' : ['grain', 'paper', 'none'].includes(tx) ? tx : d.texture;
    // شكل البطاقات: round دائري، soft حواف ناعمة، square حواف صغيرة. فاضي = شكل القالب الأصلي
    const sh = urlParams.get('ixshape') || (own ? o.shape : null);
    const shape = ['round', 'soft', 'square'].includes(sh) ? sh : null;
    const tagline = String(urlParams.get('ixtag') || o.tagline || '').trim().slice(0, 40);
    // الخلفية: لون (الافتراضي)، أو صورة، أو فيديو. ?ixbgimg= و ?ixbgvid= للتجربة في staging بس
    const tImg = DM.staging && urlParams.get('ixbgimg'), tVid = DM.staging && urlParams.get('ixbgvid');
    const bg_image = safeUrl(tImg || (own ? o.bg_image : '')), bg_video = safeUrl(tVid || (own ? o.bg_video : ''));
    const bm = tVid ? 'video' : tImg ? 'image' : own ? o.bg_mode : 'color';
    const bg_mode = bm === 'video' && bg_video ? 'video' : bm === 'image' && bg_image ? 'image' : 'color';
    return { style, bg: hex(o.bg) || d.bg, accent: hex(o.accent) || d.accent, texture, shape, tagline, bg_mode, bg_image, bg_video };
  }
  // نغمق أو نفتح اللون: k سالب = أغمق
  const ixShade = (hex, k) => '#' + [1, 3, 5].map(i => { const v = parseInt(hex.slice(i, i + 2), 16); const n = k < 0 ? v * (1 + k) : v + (255 - v) * k; return Math.round(Math.max(0, Math.min(255, n))).toString(16).padStart(2, '0'); }).join('');
  const ixRgba = (hex, a) => `rgba(${[1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(', ')}, ${a})`;
  function ixApplyLook() {
    const L = ixLook(), el = ixEl('ix');
    el.classList.toggle('ix-st-zigzag', L.style === 'zigzag');
    el.classList.toggle('ix-st-thread', L.style === 'thread');
    el.classList.toggle('ix-solid', !!L.bg);
    el.classList.toggle('ix-tex-grain', L.texture === 'grain');
    el.classList.toggle('ix-tex-paper', L.texture === 'paper');
    ['round', 'soft', 'square'].forEach(k => el.classList.toggle(`ix-sh-${k}`, L.shape === k));
    const v = {};
    if (L.bg) {
      const dark = DMTheme.textOn(L.bg) === '#ffffff';
      // النص: لون التمييز لو كان واضح على الخلفية، وإلا أبيض أو أسود
      // («خيط»: النص كريمي هادي، والذهبي للعناوين والأسعار)
      const ink = L.accent && L.style === 'zigzag' && DMTheme.textOn(L.accent) !== DMTheme.textOn(L.bg) ? L.accent : (dark ? (L.style === 'thread' ? '#efe7d4' : '#f7f3ea') : '#1c1b18');
      const tab = ixShade(L.bg, dark ? -0.28 : -0.07);
      Object.assign(v, { 'ix-bg': L.bg, 'ix-tab': tab, fg: ink, 'body-fg': ink, fg2: ixRgba(ink, .82), fg3: ixRgba(ink, .62), modal: tab, surface: tab, 'surface-line': ixRgba(ink, .14),
        line: ixRgba(ink, .2), line2: ixRgba(ink, .32), chip: ixRgba(ink, .09), chip2: ixRgba(ink, .16), 'img-line': ixRgba(ink, .16), 'input-bg': ixRgba(tab, .75), 'ring-bg': tab, price: ink });
    }
    if (L.accent) {
      Object.assign(v, { 'ix-ac': L.accent, accent: L.accent, 'accent-fg': DMTheme.textOn(L.accent) === '#ffffff' ? '#ffffff' : (L.bg && DMTheme.textOn(L.bg) === '#ffffff' ? L.bg : '#111111'), 'accent-glow': ixRgba(L.accent, .3) });
      if (!L.bg || DMTheme.textOn(L.accent) !== DMTheme.textOn(L.bg)) v.price = L.accent;
      // نص بلون التمييز (العناوين والأسماء): لو ما ينقرأ على الخلفية (فاتح على فاتح) ناخذ لون النص بداله
      v['ix-at'] = !L.bg || DMTheme.textOn(L.accent) !== DMTheme.textOn(L.bg) ? L.accent : (v.fg || L.accent);
    }
    el.style.cssText = Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(';');
    ixBgMedia(L);
    // شريط الجوال بلون الخلفية
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta && L.bg) meta.setAttribute('content', L.bg);
    return L;
  }

  // ─── خلفية المنيو التفاعلي بصورة أو فيديو: تغطي الشاشة، وفوقها طبقة بلون القالب (70%) عشان النص ينقرأ ───
  // الفيديو بدون صوت ويوقف لما الصفحة تختفي. مع «تقليل الحركة» أو توفير البيانات: لون بس
  function ixBgMedia(L) {
    const box = ixEl('ix-bgm');
    const vid = L.bg_mode === 'video' && !calmMotion ? L.bg_video : '', img = L.bg_mode === 'image' ? L.bg_image : '';
    const base = L.bg || getComputedStyle(document.body).getPropertyValue('--bg').trim();
    box.style.setProperty('--ix-ov', DMTheme.isHex(base) ? ixRgba(base, .7) : 'rgba(0, 0, 0, .6)');
    const key = vid ? `v:${vid}` : img ? `i:${img}` : '';
    ixEl('ix').classList.toggle('ix-media', !!key);
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.innerHTML = vid ? `<video src="${esc(vid)}" muted loop playsinline autoplay preload="auto" disablepictureinpicture></video>` : img ? `<img src="${esc(img)}" alt="">` : '';
    const v = box.querySelector('video');
    if (v) { v.muted = true; v.play().catch(() => {}); }
  }
  document.addEventListener('visibilitychange', () => {
    const v = ixEl('ix-bgm').querySelector('video');
    if (!v) return;
    if (document.hidden || !document.body.classList.contains('ix-mode')) v.pause(); else v.play().catch(() => {});
  });

  // يتنادى مع كل رسم للمنيو: يشغّل/يطفّي التفاعلي، ويعيد الرسم بس لو تغيّرت البيانات أو اللغة (مو مع كل تغيير في السلة)
  function ixSync() {
    const on = ixMode(), was = document.body.classList.contains('ix-mode');
    document.body.classList.toggle('ix-mode', on);
    if (!on) { clearTimeout(ixIdleT); ixEl('ix-bgm').querySelectorAll('video').forEach(v => { try { v.pause(); } catch {} }); if (was) { ixScreen = 'home'; ixDepth = 0; ixSig = ''; document.querySelectorAll('#ix .ix-scr').forEach(s => { s.classList.remove('on', 'enter'); s.querySelectorAll('video').forEach(v => { try { v.pause(); } catch {} }); }); } return; }
    ixEl('ix-lang-text').textContent = currentLang === 'ar' ? 'English' : 'عربي';
    const look = ixApplyLook();
    const sig = `${menuVersion}|${currentLang}|${allProducts.length}|${allCategories.length}|${JSON.stringify(look)}`;
    if (was && sig === ixSig) return;
    ixSig = sig;
    document.querySelectorAll('#ix .ix-scr').forEach(s => s.classList.remove('enter'));
    ixRenderHome();
    if (!was) { window.scrollTo(0, 0); ixShow('home', false); }
    else if (ixScreen !== 'home') {
      if (ixKey && ixCatsOf(ixKey).length) { const st = ixEl('ixCat').scrollTop; ixRenderCat(ixKey); ixEl('ixCat').scrollTop = st; }
      else if (ixScreen === 'cat') return ixHome();
      if (ixScreen === 'prod') { const p = productById(ixProd); if (p) ixRenderProd(p); else return ixHome(); }
      ixNav();
    }
    ixIdle();
  }

  // ─── ملء الشاشة (رابط التابلت): زر صغير في شاشة الترحيب ───
  const ixFsOk = () => { const d = document.documentElement; return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(d.requestFullscreen || d.webkitRequestFullscreen); };
  function ixFsBtn() {
    const b = ixEl('ix-fs'), show = ixTablet && ixScreen === 'home' && ixFsOk();
    b.classList.toggle('hidden', !show); b.classList.toggle('flex', show);
  }
  function ixFullscreen() {
    const d = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (d.requestFullscreen || d.webkitRequestFullscreen).call(d); if (r && r.catch) r.catch(() => {}); }
    } catch {}
  }

  // ─── الخمول: على التابلت لو ما أحد لمس الشاشة 90 ثانية يرجع للترحيب (للزبون اللي بعده) ───
  // ?idle=5 للتجربة (بالثواني). في الجوال ما نرجّعه، الزبون يمكن يقرأ على راحته
  const IX_IDLE = Math.max(3, Number(urlParams.get('idle')) || 90) * 1000;
  const ixIdleOn = () => ixTablet || urlParams.has('idle') || Math.min(innerWidth, innerHeight) >= 600;
  let ixIdleT = null;
  function ixIdle() {
    clearTimeout(ixIdleT);
    if (!document.body.classList.contains('ix-mode') || !ixIdleOn()) return;
    ixIdleT = setTimeout(() => {
      if (!ixMode()) return;
      // الزبون فاتح السلة أو المساعد: ما نقاطعه
      if (!ixEl('cartModal').classList.contains('pointer-events-none') || ixEl('chatSheet').classList.contains('open')) return ixIdle();
      closeModal();
      if (ixScreen !== 'home') ixHome();
    }, IX_IDLE);
  }
  ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => document.addEventListener(ev, ixIdle, { passive: true, capture: true }));

  initMenu();
</script>
<!-- بدون شبكة: المنيو المحفوظ يشتغل، وننبّه العميل إن الطلب يحتاج اتصال -->
<div id="offline-bar" class="hidden fixed bottom-3 inset-x-3 z-[70] mx-auto max-w-sm rounded-2xl bg-black/85 text-white text-[12.5px] font-bold px-4 py-2.5 text-center backdrop-blur-md shadow-xl" role="status"></div>
<script>
  (function () {
    // المنيو يتحفظ في الجهاز بعد أول فتح (sw.js)، ويفتح بعدها حتى لو الشبكة ضعيفة أو مقطوعة
    if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    const bar = document.getElementById('offline-bar');
    const ar = () => document.documentElement.lang !== 'en';
    const sync = () => {
      bar.textContent = ar() ? 'أنت غير متصل بالإنترنت. هذه آخر نسخة محفوظة من المنيو.' : 'You are offline. This is the last saved menu.';
      bar.classList.toggle('hidden', navigator.onLine);
    };
    window.addEventListener('online', sync); window.addEventListener('offline', sync); sync();
  })();
</script>
</body>
